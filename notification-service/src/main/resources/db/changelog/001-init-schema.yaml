databaseChangeLog:
  - changeSet:
      id: 001-create-marketplace-schema
      author: dn
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS marketplace;

  - changeSet:
      id: 002-create-notifications-table
      author: dn
      changes:
        - createTable:
            schemaName: marketplace
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recipient_account_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: channel
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: source_event_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_notifications_source_event_id
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: timestamp with time zone
              - column:
                  name: failure_reason
                  type: text
