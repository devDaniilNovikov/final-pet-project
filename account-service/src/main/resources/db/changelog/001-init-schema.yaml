databaseChangeLog:
  - changeSet:
      id: 001-create-marketplace-schema
      author: dn
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS marketplace;

  - changeSet:
      id: 002-create-accounts-table
      author: dn
      changes:
        - createTable:
            schemaName: marketplace
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: avatar_url
                  type: varchar(512)
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: keycloak_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: timestamp with time zone
              - column:
                  name: updated_at
                  type: timestamp with time zone
              - column:
                  name: phone_number
                  type: varchar(32)
              - column:
                  name: reason
                  type: varchar(1024)
              - column:
                  name: unban_date
                  type: timestamp with time zone
              - column:
                  name: is_banned
                  type: boolean

  - changeSet:
      id: 003-create-address-table
      author: dn
      changes:
        - createTable:
            schemaName: marketplace
            tableName: address
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: street
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: building
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: zip_code
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: apartment
                  type: varchar(32)
              - column:
                  name: comment
                  type: varchar(512)
              - column:
                  name: account_id
                  type: uuid
                  constraints:
                    foreignKeyName: fk_address_account
                    references: marketplace.accounts(eventId)
